# Configuración de Nginx para Monex en Ubuntu Server
# Copiar este archivo a: /etc/nginx/sites-available/monex
# Y crear el enlace simbólico: ln -s /etc/nginx/sites-available/monex /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 192.168.1.12 monex.local _; # IP del servidor Ubuntu 192.168.1.12 o dominio local

    root /var/www/monex/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/monex_access.log;
    error_log /var/log/nginx/monex_error.log;

    # Gzip compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # API Proxy hacia el backend de Node.js Express (puerto 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Archivos estáticos con caché del navegador
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Fallback para React Vite (todas las rutas van a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
