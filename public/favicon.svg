<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="monex-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="monex-inner-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#monex-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#monex-inner-glow)" stroke-width="1.5" />

  <!-- Monex Bold 'M' Emblem -->
  <path
    d="M 16 45 V 21 C 16 19.4 17.6 18.4 19 19.3 L 32 29.5 L 45 19.3 C 46.4 18.4 48 19.4 48 21 V 45"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Fintech Dot Accent -->
  <circle cx="32" cy="41" r="3.2" fill="#ffffff" />
</svg>
